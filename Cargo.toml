[workspace]
resolver = "2"
members = ["crates/luna-core", "crates/luna-data", "crates/luna-forge", "crates/luna-render", "crates/luna-ui", "crates/luna"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"

[workspace.dependencies]
anise = { version = "=0.10.6", default-features = false }
hifitime = "4.3"
wgpu = "29.0"
winit = "0.30.13"
egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = { version = "0.35.0", default-features = false, features = ["wayland", "x11"] }
bytemuck = { version = "1.25", features = ["derive"] }
pollster = "1.0"
rayon = "1.12"
tiff = "0.11"
png = "0.18"
half = "2.7"
memmap2 = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
